<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2BB3A3">
<title>鲨鱼小账本</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="app">

    <!-- 存储异常常驻提示 -->
    <div id="storageWarn" class="storage-warn hidden"></div>

    <!-- 页面容器 -->
    <main id="screens">
      <!-- 账单页 -->
      <section class="page active" id="pageBill">
        <div class="bill-header" id="billHeader">
          <div class="header-top">
            <button class="book-switch" id="bookSwitch"><span id="bookName">日常账本</span> <i>▾</i></button>
            <div class="month-switch">
              <button class="m-btn" id="monthPrev">‹</button>
              <span id="monthLabel">8月</span>
              <button class="m-btn" id="monthNext">›</button>
            </div>
          </div>
          <div class="header-sum">
            <div class="sum-item big">
              <span class="sum-label">本月支出</span>
              <strong id="sumExpense">¥0.00</strong>
            </div>
            <div class="sum-item">
              <span class="sum-label">收入</span>
              <strong id="sumIncome">¥0.00</strong>
            </div>
            <div class="sum-item">
              <span class="sum-label">结余</span>
              <strong id="sumBalance">¥0.00</strong>
            </div>
          </div>
        </div>

        <div class="page-body" id="billBody">
          <div class="tip-bar hidden" id="tipToday">今天还没记账，点 ＋ 记一笔吧</div>

          <div class="card budget-card" id="budgetCard"></div>

          <div class="seg-wrap">
            <div class="seg" id="viewSeg">
              <button class="seg-btn active" data-view="timeline">时间轴</button>
              <button class="seg-btn" data-view="calendar">日历</button>
            </div>
          </div>

          <div id="timelineView"></div>
          <div id="calendarView" class="hidden"></div>
        </div>
      </section>

      <!-- 图表页 -->
      <section class="page" id="pageChart">
        <div class="sub-header">
          <div class="month-switch dark">
            <button class="m-btn" id="cMonthPrev">‹</button>
            <span id="cMonthLabel">8月</span>
            <button class="m-btn" id="cMonthNext">›</button>
          </div>
          <div class="seg small" id="chartSeg">
            <button class="seg-btn active" data-ctype="expense">支出</button>
            <button class="seg-btn" data-ctype="income">收入</button>
          </div>
        </div>
        <div class="page-body" id="chartBody"></div>
      </section>

      <!-- 资产页 -->
      <section class="page" id="pageAsset">
        <div class="sub-header"><h2 class="sub-title">资产</h2>
          <button class="text-btn" id="privacyToggle">👁 隐藏金额</button>
        </div>
        <div class="page-body" id="assetBody"></div>
      </section>

      <!-- 我的页 -->
      <section class="page" id="pageMine">
        <div class="sub-header"><h2 class="sub-title">我的</h2></div>
        <div class="page-body" id="mineBody"></div>
      </section>
    </main>

    <!-- 底部 Tab -->
    <nav id="tabbar">
      <button class="tab active" data-tab="bill"><i>📋</i><span>账单</span></button>
      <button class="tab" data-tab="chart"><i>📊</i><span>图表</span></button>
      <button class="tab add" id="tabAdd"><span class="plus">＋</span></button>
      <button class="tab" data-tab="asset"><i>💳</i><span>资产</span></button>
      <button class="tab" data-tab="mine"><i>⚙️</i><span>我的</span></button>
    </nav>

    <!-- 记账面板 -->
    <div id="panelMask" class="mask hidden"></div>
    <div id="recordPanel" class="panel hidden">
      <div class="panel-head">
        <button class="panel-close" id="panelClose">✕</button>
        <div class="seg light" id="typeSeg">
          <button class="seg-btn active" data-rtype="expense">支出</button>
          <button class="seg-btn" data-rtype="income">收入</button>
          <button class="seg-btn" data-rtype="transfer">转账</button>
        </div>
        <span class="panel-title" id="panelTitle">记一笔</span>
      </div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="transfer-box hidden" id="transferBox"></div>
      <div class="amount-row">
        <span class="amount-sign" id="amountSign">-</span>
        <span class="amount-val" id="amountVal">0.00</span>
      </div>
      <div class="meta-row">
        <button class="meta-btn" id="metaDate">📅 今天</button>
        <button class="meta-btn" id="metaAccount">💵 现金</button>
        <button class="meta-btn grow" id="metaRemark">✏️ 加备注</button>
      </div>
      <div class="keypad" id="keypad"></div>
    </div>

    <!-- 通用弹窗层 -->
    <div id="modalLayer" class="hidden"></div>

    <!-- 新手引导 -->
    <div id="guideLayer" class="hidden"></div>

    <!-- 反馈层 -->
    <canvas id="fxCanvas"></canvas>
    <div id="flashLayer"></div>
    <div id="toastLayer"></div>

    <!-- 加载页 -->
    <div id="loading">
      <div class="load-logo">🦈</div>
      <div class="load-name">鲨鱼小账本</div>
      <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
      <div class="load-tip" id="loadTip">正在准备账本…</div>
    </div>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/loader.js"></script>
<script src="js/input.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
